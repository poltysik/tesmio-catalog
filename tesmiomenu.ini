; TesmioMenu prototype for WRSR 1.1.1.7 and TesmioLoader API 3.
; UTF-8 without BOM.

[menu]
enabled = 1
title = Tesmio Catalog

; Reserve a standalone neutral block at the far left for TesmioMenu. The
; Transport group begins with the Roads button immediately to its right.
group = 0
front = 1

; Private language id returned by this plugin's GetString hook.
text_id = 1200001

; List every resolved building name in tesmioloader.log.
probe = 1

[buildings]
; Internal object names, not Workshop item titles or Steam IDs.
; Future examples:
; building1 = CopperMine
; building2 = CopperProcessingPlant
